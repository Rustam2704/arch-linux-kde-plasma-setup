<touchégg>
  <!-- Touchpad gestures like whitebook, for the X11 session (on Wayland KWin has its own).
       Packages: touchegg (AUR), sudo systemctl enable touchegg (and start it), client autostarts
       via /etc/xdg/autostart. Actions send KWin's default shortcuts. -->
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">0d8ecb</property>
    <property name="borderColor">0d8ecb</property>
  </settings>
  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS"><repeat>false</repeat><keys>Super_L+Control_L+Right</keys></action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS"><repeat>false</repeat><keys>Super_L+Control_L+Left</keys></action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="SEND_KEYS"><repeat>false</repeat><keys>Super_L+w</keys></action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND"><repeat>false</repeat><command>qdbus6 org.kde.plasmashell /PlasmaShell activateLauncherMenu</command></action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="MAXIMIZE_RESTORE_WINDOW"><animate>true</animate></action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="MINIMIZE_WINDOW"><animate>true</animate></action>
    </gesture>
  </application>
</touchégg>
